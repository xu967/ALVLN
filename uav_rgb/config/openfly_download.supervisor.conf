; 本机已有 Supervisor；日志、断点和状态均写数据盘。
[program:openfly-datagen]
directory=/root/claude-code-backup-20261028/code/uav_rgb
command=/opt/conda/bin/python -u tools/download_openfly_datagen.py --workers 4
environment=PYTHONDONTWRITEBYTECODE="1"
autostart=true
autorestart=unexpected
; 0 为完成，2 为校验/配置错误；只有暂时的网络失败需要自动恢复。
exitcodes=0,2
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=75
redirect_stderr=true
stdout_logfile=/root/rivermind-data/uav_rgb/downloads/OpenFly_DataGen/download.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
